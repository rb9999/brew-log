# Brew Log on a Synology NAS (or any Docker host).
# Folder layout on the NAS:
#   /volume1/docker/brewlog/index.html   (the app)
#   /volume1/docker/brewlog/server.js    (tiny server, no dependencies)
#   /volume1/docker/brewlog/data/        (created automatically: brewlog.json + backups/)
# Open http://<nas-name-or-ip>:8085
services:
  brewlog:
    image: node:20-alpine
    container_name: brewlog
    command: ["node", "/app/server.js"]
    environment:
      - PORT=80
    ports:
      - "8085:80"
    volumes:
      - /volume1/docker/brewlog:/app:ro
      - /volume1/docker/brewlog/data:/data
    restart: unless-stopped
